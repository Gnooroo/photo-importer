# Copy this file to config.yaml (in the repo root, or ~/.config/photo-importer/config.yaml)
# and fill in your paths.

# Where to import from. "auto" picks the most recently mounted volume under
# /Volumes (excluding the boot volume and the NAS mount point below) -- handy
# for "just plug in the SD card and run it". Set an explicit path to be exact.
source: auto

# Local destination root. Imported files land under <local_root>/YYYY/MM/DD/.
local_root: /Users/you/Pictures/Imported

# File extensions to import (case-insensitive). Uncomment and edit to customize;
# otherwise a sensible default list of photo/video formats is used.
# extensions:
#   - .jpg
#   - .jpeg
#   - .heic
#   - .png
#   - .tif
#   - .bmp
#   - .gif
#   - .cr2
#   - .cr3
#   - .crw
#   - .nef
#   - .nrw
#   - .arw
#   - .srf
#   - .sr2
#   - .dng
#   - .orf
#   - .raf
#   - .rw2
#   - .rwl
#   - .pef
#   - .srw
#   - .x3f
#   - .3fr
#   - .dcr
#   - .kdc
#   - .mrw
#   - .erf
#   - .mos
#   - .iiq
#   - .gpr
#   - .raw
#   - .mp4
#   - .mov
#   - .avi
#   - .m4v
#   - .webm
#   - .qt

nas:
  # The local mount point where your NAS's SMB share is already mounted.
  # Mount it yourself first (Finder -> Go -> Connect to Server -> smb://...,
  # or `mount_smbfs`) -- this tool never stores or handles SMB credentials.
  mount_point: /Volumes/NAS_SHARE

  # Subfolder under the mount point to sync into (leave blank to sync to the
  # share's root).
  remote_subpath: Photos

  # Share-level smb:// URL (no subfolder), used only by the default one-shot
  # mode (`photo-importer` with no subcommand) to try auto-mounting the share
  # if it isn't already mounted -- via `open smb://...`, which uses a
  # Keychain-saved login if you have one, or pops Finder's own login dialog.
  # Optional: leave unset to skip auto-mount and just warn if not mounted.
  smb_url: smb://your-nas-hostname/NAS_SHARE

  # Concurrent rsync workers for `sync` (standalone and one-shot's background
  # loop). rsync itself doesn't parallelize transfers within one process, so
  # this runs multiple invocations at once, each covering a disjoint,
  # byte-balanced slice of the files not yet on the NAS -- useful since the
  # real bottleneck for most home setups is network bandwidth, not CPU, and
  # a single rsync stream often doesn't saturate it. Start low (1-3); going
  # much higher rarely helps once you're bandwidth-bound, and can even hurt
  # via contention. Optional: --workers overrides this per invocation.
  sync_workers: 2

# Used only by `photo-importer migrate copy` / `migrate purge` (consolidating
# an existing messy catalog into the nas.mount_point/nas.remote_subpath
# archive -- see README). Optional; --source overrides.
migrate:
  source_path: /Volumes/NAS_SHARE/SomeOldFolderToConsolidate
